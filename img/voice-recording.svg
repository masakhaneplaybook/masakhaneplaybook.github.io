<svg width="400" height="300" viewBox="0 0 400 300" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="micGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#2e8555;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1b6ec2;stop-opacity:1" />
    </linearGradient>
    <radialGradient id="soundWave" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:#25c2a0;stop-opacity:0.3" />
      <stop offset="100%" style="stop-color:#25c2a0;stop-opacity:0" />
    </radialGradient>
  </defs>
  
  <!-- Background -->
  <rect width="400" height="300" fill="#f8f9fa"/>
  
  <!-- Microphone -->
  <g transform="translate(180, 120)">
    <!-- Microphone body -->
    <rect x="-8" y="-25" width="16" height="35" rx="8" fill="url(#micGradient)" stroke="#1b6ec2" stroke-width="1"/>
    <!-- Microphone stand -->
    <rect x="-1" y="10" width="2" height="20" fill="#666"/>
    <rect x="-8" y="28" width="16" height="3" rx="1" fill="#666"/>
    <!-- Microphone grille -->
    <g stroke="white" stroke-width="0.5">
      <line x1="-5" y1="-15" x2="5" y2="-15"/>
      <line x1="-5" y1="-10" x2="5" y2="-10"/>
      <line x1="-5" y1="-5" x2="5" y2="-5"/>
      <line x1="-5" y1="0" x2="5" y2="0"/>
    </g>
  </g>
  
  <!-- Sound waves -->
  <g opacity="0.6">
    <circle cx="200" cy="95" r="60" fill="none" stroke="#25c2a0" stroke-width="2" opacity="0.3"/>
    <circle cx="200" cy="95" r="80" fill="none" stroke="#25c2a0" stroke-width="2" opacity="0.2"/>
    <circle cx="200" cy="95" r="100" fill="none" stroke="#25c2a0" stroke-width="2" opacity="0.1"/>
  </g>
  
  <!-- Waveform visualization -->
  <g stroke="#2e8555" stroke-width="2" fill="none">
    <path d="M50 200 L60 190 L70 210 L80 180 L90 220 L100 185 L110 215 L120 190 L130 205 L140 195 L150 200"/>
    <path d="M160 200 L170 185 L180 215 L190 175 L200 225 L210 180 L220 220 L230 185 L240 210 L250 190 L260 200"/>
    <path d="M270 200 L280 195 L290 205 L300 190 L310 210 L320 185 L330 215 L340 190 L350 205 L360 195 L370 200"/>
  </g>
  
  <!-- Recording interface -->
  <rect x="100" y="240" width="200" height="30" rx="15" fill="white" stroke="#25c2a0" stroke-width="2"/>
  <circle cx="130" cy="255" r="8" fill="#ff4757"/>
  <text x="150" y="260" font-family="Arial, sans-serif" font-size="12" fill="#1b6ec2">Recording...</text>
  
  <!-- Progress bar -->
  <rect x="250" y="250" width="60" height="4" rx="2" fill="#e1e5e9"/>
  <rect x="250" y="250" width="35" height="4" rx="2" fill="#25c2a0"/>
  
  <!-- Title -->
  <text x="200" y="30" font-family="Arial, sans-serif" font-size="16" font-weight="bold" text-anchor="middle" fill="#1b6ec2">Voice Recording Setup</text>
  <text x="200" y="50" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="#666">High-quality audio collection for African languages</text>
</svg>