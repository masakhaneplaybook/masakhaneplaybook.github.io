<svg width="400" height="300" viewBox="0 0 400 300" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="communityGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#25c2a0;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#2e8555;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="400" height="300" fill="#f8f9fa"/>
  
  <!-- Community circles representing people -->
  <circle cx="120" cy="120" r="25" fill="url(#communityGradient)" stroke="#1b6ec2" stroke-width="2"/>
  <circle cx="200" cy="100" r="25" fill="url(#communityGradient)" stroke="#1b6ec2" stroke-width="2"/>
  <circle cx="280" cy="120" r="25" fill="url(#communityGradient)" stroke="#1b6ec2" stroke-width="2"/>
  <circle cx="160" cy="180" r="25" fill="url(#communityGradient)" stroke="#1b6ec2" stroke-width="2"/>
  <circle cx="240" cy="180" r="25" fill="url(#communityGradient)" stroke="#1b6ec2" stroke-width="2"/>
  
  <!-- Connection lines showing collaboration -->
  <line x1="145" y1="120" x2="175" y2="100" stroke="#25c2a0" stroke-width="2" opacity="0.7"/>
  <line x1="225" y1="100" x2="255" y2="120" stroke="#25c2a0" stroke-width="2" opacity="0.7"/>
  <line x1="145" y1="135" x2="175" y2="165" stroke="#25c2a0" stroke-width="2" opacity="0.7"/>
  <line x1="225" y1="115" x2="215" y2="165" stroke="#25c2a0" stroke-width="2" opacity="0.7"/>
  <line x1="185" y1="180" x2="215" y2="180" stroke="#25c2a0" stroke-width="2" opacity="0.7"/>
  <line x1="255" y1="135" x2="225" y2="165" stroke="#25c2a0" stroke-width="2" opacity="0.7"/>
  
  <!-- Simple person icons inside circles -->
  <g fill="white">
    <!-- Person 1 -->
    <circle cx="120" cy="110" r="6"/>
    <path d="M108 125 Q108 130, 112 132 L128 132 Q132 130, 132 125 L132 120 L108 120 Z"/>
    
    <!-- Person 2 -->
    <circle cx="200" cy="90" r="6"/>
    <path d="M188 105 Q188 110, 192 112 L208 112 Q212 110, 212 105 L212 100 L188 100 Z"/>
    
    <!-- Person 3 -->
    <circle cx="280" cy="110" r="6"/>
    <path d="M268 125 Q268 130, 272 132 L288 132 Q292 130, 292 125 L292 120 L268 120 Z"/>
    
    <!-- Person 4 -->
    <circle cx="160" cy="170" r="6"/>
    <path d="M148 185 Q148 190, 152 192 L168 192 Q172 190, 172 185 L172 180 L148 180 Z"/>
    
    <!-- Person 5 -->
    <circle cx="240" cy="170" r="6"/>
    <path d="M228 185 Q228 190, 232 192 L248 192 Q252 190, 252 185 L252 180 L228 180 Z"/>
  </g>
  
  <!-- Speech bubbles with language samples -->
  <g fill="white" stroke="#2e8555" stroke-width="1">
    <ellipse cx="80" cy="80" rx="25" ry="15"/>
    <ellipse cx="320" cy="80" rx="25" ry="15"/>
    <ellipse cx="100" cy="220" rx="30" ry="15"/>
    <ellipse cx="300" cy="220" rx="25" ry="15"/>
  </g>
  
  <!-- Language text in speech bubbles -->
  <g font-family="Arial, sans-serif" font-size="8" text-anchor="middle" fill="#1b6ec2">
    <text x="80" y="85">Swahili</text>
    <text x="320" y="85">Hausa</text>
    <text x="100" y="225">Amharic</text>
    <text x="300" y="225">Yoruba</text>
  </g>
  
  <!-- Title -->
  <text x="200" y="30" font-family="Arial, sans-serif" font-size="16" font-weight="bold" text-anchor="middle" fill="#1b6ec2">Community-Driven Language Work</text>
  <text x="200" y="280" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="#666">Building partnerships with language speaker communities</text>
</svg>