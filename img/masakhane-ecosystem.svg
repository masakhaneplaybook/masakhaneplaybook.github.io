<svg width="400" height="300" viewBox="0 0 400 300" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="techGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1b6ec2;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#25c2a0;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#2e8555;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="400" height="300" fill="#f8f9fa"/>
  
  <!-- Central hub representing Masakhane -->
  <circle cx="200" cy="150" r="40" fill="url(#techGradient)" stroke="white" stroke-width="3"/>
  <text x="200" y="155" font-family="Arial, sans-serif" font-size="12" font-weight="bold" text-anchor="middle" fill="white">Masakhane</text>
  
  <!-- Connected nodes representing different aspects -->
  <g fill="#25c2a0" stroke="white" stroke-width="2">
    <!-- Data Collection -->
    <circle cx="120" cy="80" r="25"/>
    <!-- Community -->
    <circle cx="280" cy="80" r="25"/>
    <!-- Technology -->
    <circle cx="320" cy="180" r="25"/>
    <!-- Research -->
    <circle cx="260" cy="240" r="25"/>
    <!-- Education -->
    <circle cx="140" cy="240" r="25"/>
    <!-- Languages -->
    <circle cx="80" cy="180" r="25"/>
  </g>
  
  <!-- Connection lines -->
  <g stroke="#2e8555" stroke-width="2" opacity="0.7">
    <line x1="170" y1="120" x2="145" y2="105"/>
    <line x1="230" y1="120" x2="255" y2="105"/>
    <line x1="230" y1="170" x2="295" y2="165"/>
    <line x1="215" y1="185" x2="245" y2="215"/>
    <line x1="185" y1="185" x2="155" y2="215"/>
    <line x1="170" y1="170" x2="105" y2="165"/>
  </g>
  
  <!-- Icons and labels -->
  <g font-family="Arial, sans-serif" font-size="8" text-anchor="middle" fill="white">
    <text x="120" y="85">Data</text>
    <text x="280" y="85">Community</text>
    <text x="320" y="185">Tech</text>
    <text x="260" y="245">Research</text>
    <text x="140" y="245">Education</text>
    <text x="80" y="185">Languages</text>
  </g>
  
  <!-- African continent silhouette in background -->
  <g opacity="0.1" fill="#2e8555">
    <path d="M300 60 C330 55, 350 70, 365 90 C380 110, 382 140, 375 170 C368 200, 355 220, 335 235 C315 250, 290 255, 270 250 C250 245, 235 230, 230 205 C225 180, 228 150, 235 125 C242 100, 260 75, 280 65 C290 60, 295 58, 300 60 Z"/>
  </g>
  
  <!-- Title -->
  <text x="200" y="30" font-family="Arial, sans-serif" font-size="16" font-weight="bold" text-anchor="middle" fill="#1b6ec2">Masakhane Ecosystem</text>
  <text x="200" y="280" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="#666">Connecting communities, technology, and African languages</text>
</svg>