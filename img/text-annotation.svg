<svg width="400" height="300" viewBox="0 0 400 300" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="annotationGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#2e8555;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#25c2a0;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="400" height="300" fill="#f8f9fa"/>
  
  <!-- Document/text area -->
  <rect x="50" y="60" width="300" height="180" rx="5" fill="white" stroke="#e1e5e9" stroke-width="2"/>
  
  <!-- Text lines with annotations -->
  <g font-family="monospace" font-size="12">
    <!-- Original text -->
    <text x="60" y="85" fill="#333">Habari za leo kutoka Tanzania</text>
    <!-- Annotation labels -->
    <rect x="60" y="95" width="40" height="15" rx="2" fill="url(#annotationGradient)" opacity="0.8"/>
    <text x="65" y="105" font-size="8" fill="white">GREET</text>
    
    <rect x="105" y="95" width="20" height="15" rx="2" fill="#1b6ec2" opacity="0.8"/>
    <text x="108" y="105" font-size="8" fill="white">DET</text>
    
    <rect x="130" y="95" width="30" height="15" rx="2" fill="#ff6b6b" opacity="0.8"/>
    <text x="135" y="105" font-size="8" fill="white">TIME</text>
    
    <rect x="165" y="95" width="40" height="15" rx="2" fill="#4ecdc4" opacity="0.8"/>
    <text x="170" y="105" font-size="8" fill="white">PREP</text>
    
    <rect x="210" y="95" width="50" height="15" rx="2" fill="#45b7d1" opacity="0.8"/>
    <text x="215" y="105" font-size="8" fill="white">PLACE</text>
    
    <!-- Second line -->
    <text x="60" y="135" fill="#333">Mfalme alienda sokoni</text>
    <rect x="60" y="145" width="45" height="15" rx="2" fill="#ffa726" opacity="0.8"/>
    <text x="65" y="155" font-size="8" fill="white">PERSON</text>
    
    <rect x="110" y="145" width="40" height="15" rx="2" fill="#ab47bc" opacity="0.8"/>
    <text x="115" y="155" font-size="8" fill="white">VERB</text>
    
    <rect x="155" y="145" width="40" height="15" rx="2" fill="#45b7d1" opacity="0.8"/>
    <text x="160" y="155" font-size="8" fill="white">PLACE</text>
    
    <!-- Third line -->
    <text x="60" y="185" fill="#333">Ana miaka ishirini</text>
    <rect x="60" y="195" width="25" height="15" rx="2" fill="#66bb6a" opacity="0.8"/>
    <text x="65" y="205" font-size="8" fill="white">PRON</text>
    
    <rect x="90" y="195" width="35" height="15" rx="2" fill="#ef5350" opacity="0.8"/>
    <text x="95" y="205" font-size="8" fill="white">NOUN</text>
    
    <rect x="130" y="195" width="45" height="15" rx="2" fill="#ff9800" opacity="0.8"/>
    <text x="135" y="205" font-size="8" fill="white">NUMBER</text>
  </g>
  
  <!-- Annotation tools panel -->
  <rect x="60" y="260" width="280" height="25" rx="3" fill="#e1e5e9"/>
  <g font-family="Arial, sans-serif" font-size="10" fill="#666">
    <text x="70" y="275">Annotation Tags:</text>
    <circle cx="150" cy="272" r="3" fill="url(#annotationGradient)"/>
    <text x="158" y="275">Named Entity</text>
    <circle cx="220" cy="272" r="3" fill="#1b6ec2"/>
    <text x="228" y="275">POS Tag</text>
    <circle cx="290" cy="272" r="3" fill="#4ecdc4"/>
    <text x="298" y="275">Syntax</text>
  </g>
  
  <!-- Title -->
  <text x="200" y="30" font-family="Arial, sans-serif" font-size="16" font-weight="bold" text-anchor="middle" fill="#1b6ec2">Text Annotation Interface</text>
  <text x="200" y="50" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="#666">Labeling and structuring African language text data</text>
</svg>