<svg width="800" height="400" viewBox="0 0 800 400" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="heroGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1b6ec2;stop-opacity:1" />
      <stop offset="30%" style="stop-color:#25c2a0;stop-opacity:1" />
      <stop offset="70%" style="stop-color:#2e8555;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1b6ec2;stop-opacity:1" />
    </linearGradient>
    <radialGradient id="glowEffect" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:#ffffff;stop-opacity:0.8" />
      <stop offset="100%" style="stop-color:#25c2a0;stop-opacity:0.2" />
    </radialGradient>
  </defs>
  
  <!-- Background -->
  <rect width="800" height="400" fill="url(#heroGradient)"/>
  
  <!-- Decorative elements -->
  <circle cx="100" cy="80" r="40" fill="url(#glowEffect)" opacity="0.3"/>
  <circle cx="700" cy="320" r="60" fill="url(#glowEffect)" opacity="0.3"/>
  <circle cx="650" cy="100" r="30" fill="url(#glowEffect)" opacity="0.3"/>
  
  <!-- Africa continent silhouette (larger) -->
  <g transform="translate(50, 50)">
    <path d="M250 100 C320 90, 380 120, 420 160 C460 200, 470 260, 450 320 C430 380, 390 420, 340 460 C290 500, 220 520, 160 510 C100 500, 60 470, 40 420 C20 370, 30 310, 50 260 C70 210, 120 160, 170 130 C200 115, 225 103, 250 100 Z" 
          fill="rgba(255,255,255,0.1)" 
          stroke="rgba(255,255,255,0.3)" 
          stroke-width="2"/>
    
    <!-- Language diversity points on continent -->
    <circle cx="200" cy="180" r="6" fill="rgba(255,255,255,0.8)"/>
    <circle cx="260" cy="170" r="5" fill="rgba(255,255,255,0.8)"/>
    <circle cx="320" cy="190" r="6" fill="rgba(255,255,255,0.8)"/>
    <circle cx="360" cy="220" r="5" fill="rgba(255,255,255,0.8)"/>
    <circle cx="380" cy="260" r="6" fill="rgba(255,255,255,0.8)"/>
    <circle cx="350" cy="320" r="5" fill="rgba(255,255,255,0.8)"/>
    <circle cx="300" cy="360" r="6" fill="rgba(255,255,255,0.8)"/>
    <circle cx="240" cy="380" r="5" fill="rgba(255,255,255,0.8)"/>
    <circle cx="180" cy="340" r="6" fill="rgba(255,255,255,0.8)"/>
    <circle cx="140" cy="300" r="5" fill="rgba(255,255,255,0.8)"/>
    <circle cx="120" cy="240" r="6" fill="rgba(255,255,255,0.8)"/>
    <circle cx="160" cy="210" r="5" fill="rgba(255,255,255,0.8)"/>
    <circle cx="280" cy="280" r="6" fill="rgba(255,255,255,0.8)"/>
    <circle cx="320" cy="240" r="5" fill="rgba(255,255,255,0.8)"/>
  </g>
  
  <!-- Technology elements -->
  <g transform="translate(500, 100)" opacity="0.6">
    <!-- Network connections -->
    <g stroke="rgba(255,255,255,0.5)" stroke-width="1" fill="none">
      <circle cx="50" cy="50" r="20"/>
      <circle cx="150" cy="40" r="15"/>
      <circle cx="120" cy="120" r="18"/>
      <circle cx="200" cy="100" r="12"/>
      <line x1="70" y1="50" x2="135" y2="45"/>
      <line x1="65" y1="65" x2="105" y2="105"/>
      <line x1="135" y1="55" x2="185" y2="95"/>
      <line x1="140" y1="120" x2="185" y2="105"/>
    </g>
    
    <!-- Data flow arrows -->
    <g fill="rgba(255,255,255,0.7)">
      <path d="M80 30 L90 35 L80 40 L85 35 Z"/>
      <path d="M170 70 L180 75 L170 80 L175 75 Z"/>
      <path d="M140 140 L150 145 L140 150 L145 145 Z"/>
    </g>
  </g>
  
  <!-- Main title area -->
  <g transform="translate(400, 200)">
    <rect x="-150" y="-40" width="300" height="80" rx="10" fill="rgba(255,255,255,0.15)" stroke="rgba(255,255,255,0.3)" stroke-width="1"/>
    <text x="0" y="-10" font-family="Arial, sans-serif" font-size="28" font-weight="bold" text-anchor="middle" fill="white">
      Masakhane Playbook
    </text>
    <text x="0" y="20" font-family="Arial, sans-serif" font-size="14" text-anchor="middle" fill="rgba(255,255,255,0.9)">
      Building language resources for African languages
    </text>
  </g>
  
  <!-- Bottom stats -->
  <g transform="translate(0, 350)" fill="rgba(255,255,255,0.8)" font-family="Arial, sans-serif" font-size="12">
    <text x="100" y="0" text-anchor="middle">2000+ Languages</text>
    <text x="300" y="0" text-anchor="middle">100+ Language Families</text>
    <text x="500" y="0" text-anchor="middle">54 Countries</text>
    <text x="700" y="0" text-anchor="middle">1.4B+ Speakers</text>
  </g>
  
  <!-- Decorative border elements -->
  <rect x="0" y="0" width="800" height="400" fill="none" stroke="rgba(255,255,255,0.2)" stroke-width="2"/>
</svg>