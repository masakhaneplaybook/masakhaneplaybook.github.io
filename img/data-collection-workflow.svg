<svg width="400" height="300" viewBox="0 0 400 300" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="dataGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1b6ec2;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#25c2a0;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#2e8555;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="400" height="300" fill="#f8f9fa"/>
  
  <!-- Data flow visualization -->
  <g stroke="#25c2a0" stroke-width="2" fill="none">
    <!-- Voice data flow -->
    <path d="M50 80 Q150 60, 200 80 Q250 100, 350 80" opacity="0.8"/>
    <!-- Text data flow -->
    <path d="M50 150 Q150 130, 200 150 Q250 170, 350 150" opacity="0.8"/>
    <!-- Translation data flow -->
    <path d="M50 220 Q150 200, 200 220 Q250 240, 350 220" opacity="0.8"/>
  </g>
  
  <!-- Data type icons -->
  <!-- Voice/Audio icon -->
  <rect x="40" y="70" width="20" height="20" rx="3" fill="url(#dataGradient)"/>
  <circle cx="50" cy="80" r="3" fill="white"/>
  <path d="M47 77 L47 83 L49 83 L53 87 L53 73 L49 77 Z" fill="white"/>
  
  <!-- Text icon -->
  <rect x="40" y="140" width="20" height="20" rx="3" fill="url(#dataGradient)"/>
  <g fill="white" font-size="3" font-family="monospace">
    <text x="43" y="148">txt</text>
    <text x="43" y="152">abc</text>
    <text x="43" y="156">123</text>
  </g>
  
  <!-- Translation icon -->
  <rect x="40" y="210" width="20" height="20" rx="3" fill="url(#dataGradient)"/>
  <g fill="white" font-size="6" font-family="Arial">
    <text x="42" y="218">A</text>
    <text x="52" y="218">→</text>
    <text x="42" y="226">B</text>
  </g>
  
  <!-- Processing nodes -->
  <circle cx="150" cy="80" r="8" fill="#2e8555"/>
  <circle cx="150" cy="150" r="8" fill="#2e8555"/>
  <circle cx="150" cy="220" r="8" fill="#2e8555"/>
  
  <circle cx="250" cy="80" r="8" fill="#2e8555"/>
  <circle cx="250" cy="150" r="8" fill="#2e8555"/>
  <circle cx="250" cy="220" r="8" fill="#2e8555"/>
  
  <!-- Output icons -->
  <rect x="340" y="70" width="20" height="20" rx="3" fill="url(#dataGradient)"/>
  <rect x="340" y="140" width="20" height="20" rx="3" fill="url(#dataGradient)"/>
  <rect x="340" y="210" width="20" height="20" rx="3" fill="url(#dataGradient)"/>
  
  <!-- Dataset labels -->
  <text x="70" y="85" font-family="Arial, sans-serif" font-size="10" fill="#1b6ec2">Voice Data</text>
  <text x="70" y="155" font-family="Arial, sans-serif" font-size="10" fill="#1b6ec2">Text Data</text>
  <text x="70" y="225" font-family="Arial, sans-serif" font-size="10" fill="#1b6ec2">Translation Data</text>
  
  <!-- Processing labels -->
  <text x="150" y="105" font-family="Arial, sans-serif" font-size="8" text-anchor="middle" fill="#666">Collect</text>
  <text x="250" y="105" font-family="Arial, sans-serif" font-size="8" text-anchor="middle" fill="#666">Process</text>
  
  <!-- Title -->
  <text x="200" y="30" font-family="Arial, sans-serif" font-size="16" font-weight="bold" text-anchor="middle" fill="#1b6ec2">Data Collection Workflow</text>
  <text x="200" y="280" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="#666">From raw data to high-quality language resources</text>
</svg>