<svg width="400" height="300" viewBox="0 0 400 300" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="translationGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1b6ec2;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#2e8555;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="400" height="300" fill="#f8f9fa"/>
  
  <!-- Left language column -->
  <rect x="30" y="80" width="150" height="140" rx="5" fill="white" stroke="#25c2a0" stroke-width="2"/>
  <text x="105" y="60" font-family="Arial, sans-serif" font-size="12" font-weight="bold" text-anchor="middle" fill="#1b6ec2">Swahili</text>
  
  <g font-family="Arial, sans-serif" font-size="11" fill="#333">
    <text x="40" y="105">Habari za asubuhi</text>
    <text x="40" y="125">Ninafuraha kukuona</text>
    <text x="40" y="145">Hali ya hewa ni nzuri</text>
    <text x="40" y="165">Tutaonana kesho</text>
    <text x="40" y="185">Asante sana</text>
    <text x="40" y="205">Karibu nyumbani</text>
  </g>
  
  <!-- Right language column -->
  <rect x="220" y="80" width="150" height="140" rx="5" fill="white" stroke="#2e8555" stroke-width="2"/>
  <text x="295" y="60" font-family="Arial, sans-serif" font-size="12" font-weight="bold" text-anchor="middle" fill="#1b6ec2">English</text>
  
  <g font-family="Arial, sans-serif" font-size="11" fill="#333">
    <text x="230" y="105">Good morning</text>
    <text x="230" y="125">I'm happy to see you</text>
    <text x="230" y="145">The weather is nice</text>
    <text x="230" y="165">See you tomorrow</text>
    <text x="230" y="185">Thank you very much</text>
    <text x="230" y="205">Welcome home</text>
  </g>
  
  <!-- Translation arrows -->
  <g fill="url(#translationGradient)">
    <path d="M185 100 L210 100 L205 95 M210 100 L205 105"/>
    <path d="M185 120 L210 120 L205 115 M210 120 L205 125"/>
    <path d="M185 140 L210 140 L205 135 M210 140 L205 145"/>
    <path d="M185 160 L210 160 L205 155 M210 160 L205 165"/>
    <path d="M185 180 L210 180 L205 175 M210 180 L205 185"/>
    <path d="M185 200 L210 200 L205 195 M210 200 L205 205"/>
  </g>
  
  <!-- Bidirectional arrow in center -->
  <circle cx="200" cy="150" r="15" fill="url(#translationGradient)" stroke="white" stroke-width="2"/>
  <g fill="white" stroke="white" stroke-width="1">
    <path d="M192 145 L197 150 L192 155"/>
    <path d="M208 155 L203 150 L208 145"/>
  </g>
  
  <!-- Quality indicators -->
  <g font-family="Arial, sans-serif" font-size="8" fill="#666">
    <text x="105" y="245" text-anchor="middle">Quality Score: 0.95</text>
    <text x="295" y="245" text-anchor="middle">Alignment: 98%</text>
  </g>
  
  <!-- Progress bars -->
  <rect x="60" y="250" width="90" height="4" rx="2" fill="#e1e5e9"/>
  <rect x="60" y="250" width="85" height="4" rx="2" fill="#25c2a0"/>
  
  <rect x="250" y="250" width="90" height="4" rx="2" fill="#e1e5e9"/>
  <rect x="250" y="250" width="88" height="4" rx="2" fill="#2e8555"/>
  
  <!-- Title -->
  <text x="200" y="30" font-family="Arial, sans-serif" font-size="16" font-weight="bold" text-anchor="middle" fill="#1b6ec2">Parallel Translation Datasets</text>
  <text x="200" y="280" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="#666">High-quality aligned bilingual corpora for machine translation</text>
</svg>